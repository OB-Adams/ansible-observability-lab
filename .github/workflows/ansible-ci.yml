name: Ansible CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Ansible
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ansible

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Ansible and linting tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install ansible-core ansible-lint

      - name: Install required collections
        run: ansible-galaxy collection install -r requirements.yml

      - name: Lint Ansible project
        run: ansible-lint

      - name: Check individual playbook syntax
        shell: bash
        run: |
          set -euo pipefail

          for playbook in playbooks/*.yml; do
            if [[ ! -f "$playbook" ]]; then
              echo "No playbooks found in playbooks/"
              exit 1
            fi

            echo "::group::Checking ${playbook}"
            ansible-playbook "$playbook" --syntax-check
            echo "::endgroup::"
          done

      - name: Check master playbook syntax
        run: ansible-playbook site.yml --syntax-check
