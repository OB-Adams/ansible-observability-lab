- name: Display operating system information
  ansible.builtin.debug:
    msg: "Managing {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_version'] }}"

- name: Install baseline packages
  ansible.builtin.package:
    name:
      - curl
      - tar
      - unzip
    state: present

- name: Configure hostname
  ansible.builtin.hostname:
    name: "{{ server_hostname }}"

- name: Configure hosts file
  ansible.builtin.template:
    src: hosts.j2
    dest: /etc/hosts
    owner: root
    group: root
    mode: "0644"

- name: Create observability directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

  loop:
    - /opt/observability
    - /etc/observability

- name: Enable and start firewalld
  ansible.builtin.service:
    name: firewalld
    state: started
    enabled: true
  when: ansible_facts["os_family"] == "RedHat" 

- name: Allow SSH through firewalld
  ansible.posix.firewalld:
    port: "{{ ssh_port }}/tcp"
    permanent: true
    immediate: true
    state: enabled
  when: ansible_facts["os_family"] == "RedHat"

- name: Allow SSH through ufw
  community.general.ufw:
    state: enabled
    rule: allow
    port: "{{ ssh_port }}"
    proto: tcp
  when: ansible_facts["os_family"] == "Debian"

- name: Enable and start ufw
  ansible.builtin.service:
    name: ufw
    state: started
    enabled: true
  when: ansible_facts["os_family"] == "Debian"

