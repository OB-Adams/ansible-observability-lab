- name: Create Prometheus group
  ansible.builtin.group:
    name: "{{ prometheus_group }}"
    state: present

- name: Create Prometheus user
  ansible.builtin.user:
    name: "{{ prometheus_user }}"
    group: "{{ prometheus_group }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Create Prometheus installation directory
  ansible.builtin.file:
    path: "{{ prometheus_install_dir }}"
    state: directory
    owner: "{{ prometheus_user }}"
    group: "{{ prometheus_group }}"
    mode: "0755"

- name: Create Prometheus configuration directory
  ansible.builtin.file:
    path: "{{ prometheus_config_dir }}"
    state: directory
    owner: "{{ prometheus_user }}"
    group: "{{ prometheus_group }}"
    mode: "0755"

- name: Create Prometheus data directory
  ansible.builtin.file:
    path: "{{ prometheus_data_dir }}"
    state: directory
    owner: "{{ prometheus_user }}"
    group: "{{ prometheus_group }}"
    mode: "0755"

- name: Download Prometheus checksum manifest
  ansible.builtin.get_url:
    url: "{{ prometheus_checksum_url }}"
    dest: "{{ prometheus_checksum_file }}"
    mode: "0644"

- name: Read Prometheus archive checksum
  ansible.builtin.command:
    argv:
      - awk
      - "-v"
      - "filename={{ prometheus_archive_filename }}"
      - '$2 == filename { print $1 }'
      - "{{ prometheus_checksum_file }}"
  register: prometheus_expected_checksum
  changed_when: false

- name: Validate Prometheus archive checksum entry
  ansible.builtin.assert:
    that:
      - prometheus_expected_checksum.stdout | length == 64
      - prometheus_expected_checksum.stdout is match('^[a-fA-F0-9]{64}$')
    fail_msg: >-
      No valid SHA-256 checksum was found for
      {{ prometheus_archive_filename }} in the official checksum manifest.

- name: Download and verify Prometheus archive
  ansible.builtin.get_url:
    url: "{{ prometheus_download_url }}"
    dest: "{{ prometheus_archive_path }}"
    checksum: "sha256:{{ prometheus_expected_checksum.stdout }}"
    mode: "0644"

- name: Extract verified Prometheus archive
  ansible.builtin.unarchive:
    src: "{{ prometheus_archive_path }}"
    dest: "{{ prometheus_download_dir }}"
    remote_src: true
    creates: "{{ prometheus_download_dir }}/prometheus-{{ prometheus_version }}.linux-{{ prometheus_arch }}"

- name: Install Prometheus binary
  ansible.builtin.copy:
    src: "{{ prometheus_download_dir }}/prometheus-{{ prometheus_version }}.linux-{{ prometheus_arch }}/prometheus"
    dest: "{{ prometheus_install_dir }}/prometheus"
    owner: "{{ prometheus_user }}"
    group: "{{ prometheus_group }}"
    mode: "0755"
    remote_src: true
  notify: Restart Prometheus

- name: Install promtool binary
  ansible.builtin.copy:
    src: "{{ prometheus_download_dir }}/prometheus-{{ prometheus_version }}.linux-{{ prometheus_arch }}/promtool"
    dest: "{{ prometheus_install_dir }}/promtool"
    owner: "{{ prometheus_user }}"
    group: "{{ prometheus_group }}"
    mode: "0755"
    remote_src: true

- name: Ensure Prometheus rules directory exists
  ansible.builtin.file:
    path: "{{ prometheus_config_dir }}/rules"
    state: directory
    owner: "{{ prometheus_user }}"
    group: "{{ prometheus_group }}"
    mode: "0755"

- name: Deploy Prometheus alert rules
  ansible.builtin.template:
    src: node-alerts.yml.j2
    dest: "{{ prometheus_rules_file }}"
    owner: "{{ prometheus_user }}"
    group: "{{ prometheus_group }}"
    mode: "0644"
  notify: Restart Prometheus

- name: Render Prometheus configuration candidate
  ansible.builtin.template:
    src: prometheus.yml.j2
    dest: "{{ prometheus_candidate_config_file }}"
    owner: root
    group: root
    mode: "0600"

- name: Validate Prometheus configuration candidate
  ansible.builtin.command:
    argv:
      - "{{ prometheus_install_dir }}/promtool"
      - check
      - config
      - "{{ prometheus_candidate_config_file }}"
  changed_when: false

- name: Deploy validated Prometheus configuration
  ansible.builtin.copy:
    src: "{{ prometheus_candidate_config_file }}"
    dest: "{{ prometheus_config_file }}"
    remote_src: true
    owner: "{{ prometheus_user }}"
    group: "{{ prometheus_group }}"
    mode: "0644"
  notify: Restart Prometheus

- name: Remove Prometheus configuration candidate
  ansible.builtin.file:
    path: "{{ prometheus_candidate_config_file }}"
    state: absent

- name: Deploy Prometheus systemd service
  ansible.builtin.template:
    src: prometheus.service.j2
    dest: /etc/systemd/system/prometheus.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart Prometheus

- name: Ensure Prometheus service is enabled and started
  ansible.builtin.systemd_service:
    name: "{{ prometheus_service_name }}"
    enabled: true
    state: started
    daemon_reload: true
