- name: Create Alertmanager group
  ansible.builtin.group:
    name: "{{ alertmanager_group }}"
    system: true

- name: Create Alertmanager user
  ansible.builtin.user:
    name: "{{ alertmanager_user }}"
    group: "{{ alertmanager_group }}"
    system: true
    shell: /usr/sbin/nologin
    home: "{{ alertmanager_install_dir }}"
    create_home: false

- name: Create Alertmanager directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ alertmanager_user }}"
    group: "{{ alertmanager_group }}"
    mode: "{{ item.mode }}"
  loop:
    - path: "{{ alertmanager_install_dir }}"
      mode: "0755"
    - path: "{{ alertmanager_config_dir }}"
      mode: "0755"
    - path: "{{ alertmanager_data_dir }}"
      mode: "0750"

- name: Download Alertmanager checksum manifest
  ansible.builtin.get_url:
    url: "{{ alertmanager_checksum_url }}"
    dest: "{{ alertmanager_checksum_file }}"
    mode: "0644"
    force: true
    timeout: 120

- name: Read Alertmanager archive checksum
  ansible.builtin.command:
    argv:
      - awk
      - "-v"
      - "filename={{ alertmanager_archive_filename }}"
      - '$2 == filename { print $1 }'
      - "{{ alertmanager_checksum_file }}"
  register: alertmanager_expected_checksum
  changed_when: false

- name: Validate Alertmanager archive checksum entry
  ansible.builtin.assert:
    that:
      - alertmanager_expected_checksum.stdout | length == 64
      - alertmanager_expected_checksum.stdout is match('^[a-fA-F0-9]{64}$')
    fail_msg: >-
      No valid SHA-256 checksum was found for
      {{ alertmanager_archive_filename }} in the checksum manifest.

- name: Download and verify Alertmanager archive
  ansible.builtin.get_url:
    url: "{{ alertmanager_download_url }}"
    dest: "{{ alertmanager_archive_path }}"
    checksum: "sha256:{{ alertmanager_expected_checksum.stdout }}"
    mode: "0644"
    timeout: 120

- name: Extract verified Alertmanager archive
  ansible.builtin.unarchive:
    src: "{{ alertmanager_archive_path }}"
    dest: "{{ alertmanager_download_dir }}"
    remote_src: true
    creates: "{{ alertmanager_download_dir }}/alertmanager-{{ alertmanager_version }}.linux-{{ alertmanager_arch }}"

- name: Install Alertmanager binary
  ansible.builtin.copy:
    src: "/tmp/alertmanager-{{ alertmanager_version }}.linux-{{ alertmanager_arch }}/alertmanager"
    dest: "{{ alertmanager_install_dir }}/alertmanager"
    remote_src: true
    owner: root
    group: root
    mode: "0755"
  notify: Restart Alertmanager

- name: Install amtool binary
  ansible.builtin.copy:
    src: "/tmp/alertmanager-{{ alertmanager_version }}.linux-{{ alertmanager_arch }}/amtool"
    dest: "{{ alertmanager_install_dir }}/amtool"
    remote_src: true
    owner: root
    group: root
    mode: "0755"

- name: Render Alertmanager configuration candidate
  ansible.builtin.template:
    src: alertmanager.yml.j2
    dest: "{{ alertmanager_candidate_config_file }}"
    owner: root
    group: root
    mode: "0600"
  changed_when: false

- name: Validate Alertmanager configuration candidate
  ansible.builtin.command:
    argv:
      - "{{ alertmanager_install_dir }}/amtool"
      - check-config
      - "{{ alertmanager_candidate_config_file }}"
  changed_when: false

- name: Deploy validated Alertmanager configuration
  ansible.builtin.copy:
    src: "{{ alertmanager_candidate_config_file }}"
    dest: "{{ alertmanager_config_file }}"
    remote_src: true
    owner: "{{ alertmanager_user }}"
    group: "{{ alertmanager_group }}"
    mode: "0640"
  notify: Restart Alertmanager

- name: Remove Alertmanager configuration candidate
  ansible.builtin.file:
    path: "{{ alertmanager_candidate_config_file }}"
    state: absent
  changed_when: false

- name: Deploy Alertmanager systemd service
  ansible.builtin.template:
    src: alertmanager.service.j2
    dest: "/etc/systemd/system/{{ alertmanager_service_name }}.service"
    owner: root
    group: root
    mode: "0644"
  notify: Restart Alertmanager

- name: Allow Alertmanager
  community.general.ufw:
    rule: allow
    port: "{{ alertmanager_port }}"
    proto: tcp

- name: Enable and start Alertmanager
  ansible.builtin.systemd_service:
    name: "{{ alertmanager_service_name }}"
    enabled: true
    state: started
    daemon_reload: true
