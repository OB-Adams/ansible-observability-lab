- name: Ensure APT keyring directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Download Grafana APT signing key
  ansible.builtin.get_url:
    url: "{{ grafana_apt_key_url }}"
    dest: "{{ grafana_apt_keyring }}"
    owner: root
    group: root
    mode: "0644"

- name: Configure Grafana APT repository
  ansible.builtin.deb822_repository:
    name: grafana
    types: deb
    uris: https://apt.grafana.com
    suites: stable
    components:
      - main
    signed_by: "{{ grafana_apt_keyring }}"
    state: present

- name: Install Grafana
  ansible.builtin.apt:
    name: "{{ grafana_package_name }}"
    state: present
    update_cache: true

- name: Deploy Grafana configuration
  ansible.builtin.template:
    src: grafana.ini.j2
    dest: "{{ grafana_config_file }}"
    owner: root
    group: grafana
    mode: "0640"
  notify: Restart Grafana

- name: Allow Grafana
  community.general.ufw:
    rule: allow
    port: "{{ grafana_port }}"
    proto: tcp

- name: Enable and start Grafana
  ansible.builtin.systemd_service:
    name: "{{ grafana_service_name }}"
    enabled: true
    state: started
