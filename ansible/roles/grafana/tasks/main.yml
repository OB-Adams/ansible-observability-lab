- name: Require a strong Grafana admin password
  ansible.builtin.assert:
    that:
      - grafana_admin_password is defined
      - grafana_admin_password | length >= 12
      - grafana_admin_password != grafana_default_admin_password
    fail_msg: >-
      Set grafana_admin_password (12+ characters, not "admin") in Ansible Vault,
      e.g. ansible-vault edit inventory/group_vars/observability.yml
    quiet: true

- name: Ensure APT keyring directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Download Grafana APT signing key
  ansible.builtin.get_url:
    url: "{{ grafana_apt_key_url }}"
    dest: "{{ grafana_apt_keyring }}"
    owner: root
    group: root
    mode: "0644"

- name: Configure Grafana APT repository
  ansible.builtin.deb822_repository:
    name: grafana
    types: deb
    uris: https://apt.grafana.com
    suites: stable
    components:
      - main
    signed_by: "{{ grafana_apt_keyring }}"
    state: present

- name: Install Grafana
  ansible.builtin.apt:
    name: "{{ grafana_package_name }}"
    state: present
    update_cache: true

- name: Ensure Grafana datasource directory exists
  ansible.builtin.file:
    path: "{{ grafana_datasources_dir }}"
    state: directory
    owner: root
    group: grafana
    mode: "0750"

- name: Deploy Grafana configuration
  ansible.builtin.template:
    src: grafana.ini.j2
    dest: "{{ grafana_config_file }}"
    owner: root
    group: grafana
    mode: "0640"
  notify: Restart Grafana
  no_log: true

- name: Deploy Grafana datasource configuration
  ansible.builtin.template:
    src: datasources.yml.j2
    dest: "{{ grafana_datasources_file }}"
    owner: root
    group: grafana
    mode: "0640"
  notify: Restart Grafana

- name: Allow Grafana
  community.general.ufw:
    rule: allow
    port: "{{ grafana_port }}"
    proto: tcp

- name: Enable and start Grafana
  ansible.builtin.systemd_service:
    name: "{{ grafana_service_name }}"
    enabled: true
    state: started

- name: Apply pending Grafana restarts before checking the admin login
  ansible.builtin.meta: flush_handlers

- name: Ensure the Grafana admin password is set
  ansible.builtin.include_tasks: admin_password.yml
