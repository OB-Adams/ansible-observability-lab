- name: Wait for Grafana to accept connections
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: "{{ grafana_port }}"
    timeout: 60

- name: Check login with the configured admin password
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ grafana_port }}/api/user"
    url_username: "{{ grafana_admin_user }}"
    url_password: "{{ grafana_admin_password }}"
    force_basic_auth: true
    status_code: [200, 401]
  register: grafana_admin_login
  changed_when: false
  no_log: true

- name: Replace the default admin password
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ grafana_port }}/api/user/password"
    method: PUT
    url_username: "{{ grafana_admin_user }}"
    url_password: "{{ grafana_default_admin_password }}"
    force_basic_auth: true
    body_format: json
    body:
      oldPassword: "{{ grafana_default_admin_password }}"
      newPassword: "{{ grafana_admin_password }}"
      confirmNew: "{{ grafana_admin_password }}"
    status_code: [200, 401]
  register: grafana_admin_change
  changed_when: grafana_admin_change.status == 200
  when: grafana_admin_login.status == 401
  no_log: true

- name: Stop if the admin password is neither the vaulted one nor the default
  ansible.builtin.fail:
    msg: >-
      Cannot log in to Grafana as {{ grafana_admin_user }} with either the vaulted
      grafana_admin_password or the default password. Reset it once by hand, e.g.
      grafana cli --homepath /usr/share/grafana admin reset-admin-password '<password>'
      then re-run this playbook.
  when:
    - grafana_admin_login.status == 401
    - grafana_admin_change.status | default(0) != 200
