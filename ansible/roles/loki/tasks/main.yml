- name: Create Loki group
  ansible.builtin.group:
    name: "{{ loki_group }}"
    state: present

- name: Create Loki user
  ansible.builtin.user:
    name: "{{ loki_user }}"
    group: "{{ loki_group }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Create Loki installation directory
  ansible.builtin.file:
    path: "{{ loki_install_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Create Loki configuration directory
  ansible.builtin.file:
    path: "{{ loki_config_dir }}"
    state: directory
    owner: root
    group: "{{ loki_group }}"
    mode: "0750"

- name: Create Loki data directory
  ansible.builtin.file:
    path: "{{ loki_data_dir }}"
    state: directory
    owner: "{{ loki_user }}"
    group: "{{ loki_group }}"
    mode: "0750"

- name: Create Loki release directory
  ansible.builtin.file:
    path: "{{ loki_release_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Download Loki archive
  ansible.builtin.get_url:
    url: "{{ loki_download_url }}"
    dest: "{{ loki_archive_path }}"
    mode: "0644"

- name: Extract Loki archive
  ansible.builtin.unarchive:
    src: "{{ loki_archive_path }}"
    dest: "{{ loki_release_dir }}"
    remote_src: true
    creates: "{{ loki_release_binary }}"

- name: Install Loki binary
  ansible.builtin.copy:
    src: "{{ loki_release_binary }}"
    dest: "{{ loki_binary_path }}"
    remote_src: true
    owner: root
    group: root
    mode: "0755"
  notify: Restart Loki

- name: Render Loki configuration candidate
  ansible.builtin.template:
    src: loki-config.yml.j2
    dest: "{{ loki_candidate_config_file }}"
    owner: root
    group: root
    mode: "0600"

- name: Validate Loki configuration candidate
  ansible.builtin.command:
    argv:
      - "{{ loki_binary_path }}"
      - "-config.file={{ loki_candidate_config_file }}"
      - "-verify-config"
  changed_when: false

- name: Deploy validated Loki configuration
  ansible.builtin.copy:
    src: "{{ loki_candidate_config_file }}"
    dest: "{{ loki_config_file }}"
    remote_src: true
    owner: "{{ loki_user }}"
    group: "{{ loki_group }}"
    mode: "0640"
  notify: Restart Loki

- name: Remove Loki configuration candidate
  ansible.builtin.file:
    path: "{{ loki_candidate_config_file }}"
    state: absent

- name: Deploy Loki systemd service
  ansible.builtin.template:
    src: loki.service.j2
    dest: "/etc/systemd/system/{{ loki_service_name }}.service"
    owner: root
    group: root
    mode: "0644"
  notify: Restart Loki

- name: Allow Loki through UFW
  community.general.ufw:
    rule: allow
    port: "{{ loki_port }}"
    proto: tcp

- name: Ensure Loki service is enabled and started
  ansible.builtin.systemd_service:
    name: "{{ loki_service_name }}"
    enabled: true
    state: started
    daemon_reload: true
