- name: Create Loki group
  ansible.builtin.group:
    name: "{{ loki_group }}"
    state: present

- name: Create Loki user
  ansible.builtin.user:
    name: "{{ loki_user }}"
    group: "{{ loki_group }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Create Loki installation directory
  ansible.builtin.file:
    path: "{{ loki_install_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Create Loki configuration directory
  ansible.builtin.file:
    path: "{{ loki_config_dir }}"
    state: directory
    owner: root
    group: "{{ loki_group }}"
    mode: "0750"

- name: Create Loki data directory
  ansible.builtin.file:
    path: "{{ loki_data_dir }}"
    state: directory
    owner: "{{ loki_user }}"
    group: "{{ loki_group }}"
    mode: "0750"

- name: Download Loki archive
  ansible.builtin.get_url:
    url: "{{ loki_download_url }}"
    dest: "/tmp/loki-linux-arm64.zip"
    mode: "0644"

- name: Extract Loki archive
  ansible.builtin.unarchive:
    src: "/tmp/loki-linux-arm64.zip"
    dest: "{{ loki_install_dir }}"
    remote_src: true
    creates: "{{ loki_install_dir }}/loki-linux-arm64"

- name: Install Loki binary
  ansible.builtin.copy:
    src: "{{ loki_install_dir }}/loki-linux-arm64"
    dest: "{{ loki_install_dir }}/loki"
    remote_src: true
    owner: root
    group: root
    mode: "0755"

- name: Deploy Loki configuration
  ansible.builtin.template:
    src: loki-config.yml.j2
    dest: "{{ loki_config_file }}"
    owner: root
    group: "{{ loki_group }}"
    mode: "0640"
  notify: Restart Loki

- name: Deploy Loki systemd service
  ansible.builtin.template:
    src: loki.service.j2
    dest: "/etc/systemd/system/{{ loki_service_name }}.service"
    owner: root
    group: root
    mode: "0644"
  notify: Restart Loki

- name: Ensure Loki service is enabled and started
  ansible.builtin.systemd_service:
    name: "{{ loki_service_name }}"
    enabled: true
    state: started
    daemon_reload: true
