- name: Create Node Exporter group
  ansible.builtin.group:
    name: "{{ node_exporter_group }}"
    system: true

- name: Create Node Exporter user
  ansible.builtin.user:
    name: "{{ node_exporter_user }}"
    group: "{{ node_exporter_group }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Download Node Exporter archive
  ansible.builtin.get_url:
    url: "{{ node_exporter_download_url }}"
    dest: "{{ node_exporter_download_dir }}/node_exporter.tar.gz"
    mode: "0644"

- name: Extract Node Exporter archive
  ansible.builtin.unarchive:
    src: "{{ node_exporter_download_dir }}/node_exporter.tar.gz"
    dest: "{{ node_exporter_download_dir }}"
    remote_src: true

- name: Install Node Exporter binary
  ansible.builtin.copy:
    src: "{{ node_exporter_download_dir }}/node_exporter-{{ node_exporter_version }}.linux-{{ node_exporter_arch }}/node_exporter"
    dest: "{{ node_exporter_install_dir }}/node_exporter"
    owner: "{{ node_exporter_user }}"
    group: "{{ node_exporter_group }}"
    mode: "0755"
    remote_src: true

- name: Install Node Exporter systemd service
  ansible.builtin.template:
    src: node_exporter.service.j2
    dest: /etc/systemd/system/node_exporter.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart Node Exporter

- name: Enable and start Node Exporter
  ansible.builtin.systemd_service:
    name: node_exporter
    state: started
    enabled: true

- name: Allow Node Exporter through firewalld
  ansible.posix.firewalld:
    port: "{{ node_exporter_port }}/tcp"
    permanent: true
    immediate: true
    state: enabled
  when: ansible_facts["os_family"] == "RedHat"

- name: Allow Node Exporter through UFW
  community.general.ufw:
    rule: allow
    port: "{{ node_exporter_port }}"
    proto: tcp
  when: ansible_facts["os_family"] == "Debian"
