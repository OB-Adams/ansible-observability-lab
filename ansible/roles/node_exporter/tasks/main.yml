- name: Create Node Exporter group
  ansible.builtin.group:
    name: "{{ node_exporter_group }}"
    system: true

- name: Create Node Exporter user
  ansible.builtin.user:
    name: "{{ node_exporter_user }}"
    group: "{{ node_exporter_group }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Download Node Exporter checksum manifest
  ansible.builtin.get_url:
    url: "{{ node_exporter_checksum_url }}"
    dest: "{{ node_exporter_checksum_file }}"
    mode: "0644"
    force: true

- name: Read Node Exporter archive checksum
  ansible.builtin.command:
    argv:
      - awk
      - "-v"
      - "filename={{ node_exporter_archive_filename }}"
      - '$2 == filename { print $1 }'
      - "{{ node_exporter_checksum_file }}"
  register: node_exporter_expected_checksum
  changed_when: false

- name: Validate Node Exporter archive checksum entry
  ansible.builtin.assert:
    that:
      - node_exporter_expected_checksum.stdout | length == 64
      - node_exporter_expected_checksum.stdout is match('^[a-fA-F0-9]{64}$')
    fail_msg: >-
      No valid SHA-256 checksum was found for
      {{ node_exporter_archive_filename }} in the official checksum manifest.

- name: Download and verify Node Exporter archive
  ansible.builtin.get_url:
    url: "{{ node_exporter_download_url }}"
    dest: "{{ node_exporter_archive_path }}"
    checksum: "sha256:{{ node_exporter_expected_checksum.stdout }}"
    mode: "0644"

- name: Extract verified Node Exporter archive
  ansible.builtin.unarchive:
    src: "{{ node_exporter_archive_path }}"
    dest: "{{ node_exporter_download_dir }}"
    remote_src: true
    creates: "{{ node_exporter_download_dir }}/node_exporter-{{ node_exporter_version }}.linux-{{ node_exporter_arch }}"

- name: Install Node Exporter binary
  ansible.builtin.copy:
    src: "{{ node_exporter_download_dir }}/node_exporter-{{ node_exporter_version }}.linux-{{ node_exporter_arch }}/node_exporter"
    dest: "{{ node_exporter_install_dir }}/node_exporter"
    owner: "{{ node_exporter_user }}"
    group: "{{ node_exporter_group }}"
    mode: "0755"
    remote_src: true
  notify: Restart Node Exporter

- name: Install Node Exporter systemd service
  ansible.builtin.template:
    src: node_exporter.service.j2
    dest: /etc/systemd/system/node_exporter.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart Node Exporter

- name: Enable and start Node Exporter
  ansible.builtin.systemd_service:
    name: node_exporter
    state: started
    enabled: true

- name: Allow Node Exporter through firewalld
  ansible.posix.firewalld:
    port: "{{ node_exporter_port }}/tcp"
    permanent: true
    immediate: true
    state: enabled
  when: ansible_facts["os_family"] == "RedHat"

- name: Allow Node Exporter through UFW
  community.general.ufw:
    rule: allow
    port: "{{ node_exporter_port }}"
    proto: tcp
  when: ansible_facts["os_family"] == "Debian"
